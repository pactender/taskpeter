AutoName: TaskPeter
Name: TaskPeter
Summary: Developer task tracker & Git sprint studio
Description: |-
  TaskPeter is a native, offline-first task tracker built for developers.

  Features include GitHub issue and pull request synchronization, focus sprint
  timers with binaural sound synthesis, an optional Gemini-powered AI assistant,
  interactive velocity analytics, and markdown standup exports.

  * Track tasks through TODO, In Progress, Review, and Done workflows with
    priorities, estimates, deadlines and tags.
  * Sync repositories, issues and pull requests from GitHub (optional).
  * Run focus sprints (Pomodoro, deep work, flow state) with synthesized
    focus audio and streak tracking.
  * Export workspaces as sanitized JSON or markdown standup summaries.

  The core app works fully offline with a local Room database. GitHub sync,
  cloud backup and the AI assistant are optional features that require
  network access and user-configured accounts or API keys.

